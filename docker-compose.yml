services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: szu
      POSTGRES_PASSWORD: szu
      POSTGRES_DB: szu_memoir
    ports:
      - "5432:5432"
    volumes:
      - szu_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    environment:
      # 迁移已在 /docker-entry.sh 执行；勿在 lifespan 内重复跑 Alembic（见 backend/docker-entry.sh）
      SKIP_STARTUP_DB_BOOTSTRAP: "1"
      DATABASE_URL: postgresql+psycopg://szu:szu@db:5432/szu_memoir
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
      # 含 5174 等备用端口（Vite 端口被占用时会换端口）
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:4173,http://localhost:4173
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      # 勿填示例 Key；留空则在网页「API 设置」保存真实 sk-，或在根目录 .env 写 SILICONFLOW_API_KEY
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      # 记忆助手 / 向量索引访问上游超时（秒）；若报 Request timed out 可适当加大
      SILICONFLOW_HTTP_TIMEOUT: ${SILICONFLOW_HTTP_TIMEOUT:-240}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-admin@szu.local}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-admin123456}
    depends_on:
      - db

volumes:
  szu_pg:
