<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>深大记忆 · 静态演示（frontend-demo 复刻）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700&family=Noto+Sans+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3ede4;
        --surface: #faf7f2;
        --surface-raised: #ffffff;
        --text: #3d3834;
        --text-muted: #8a8278;
        --accent: #c9728a;
        --accent-hover: #b55d76;
        --accent-soft: rgba(201, 114, 138, 0.16);
        --accent-glow: rgba(201, 114, 138, 0.32);
        --on-accent: #fffefc;
        --border: rgba(61, 56, 52, 0.1);
        --border-strong: rgba(61, 56, 52, 0.16);
        --shadow-sm: 0 2px 14px rgba(61, 56, 52, 0.06);
        --shadow-md: 0 10px 36px rgba(61, 56, 52, 0.09);
        --shadow-lg: 0 20px 48px rgba(61, 56, 52, 0.11);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --duration: 0.2s;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        font-family: 'Noto Sans SC', system-ui, sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .app-shell {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .top-bar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--surface-raised);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        z-index: 5;
      }
      .top-bar__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
        flex: 1 1 auto;
        justify-content: space-between;
      }
      .top-bar__brand {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
      }
      .top-bar__name {
        font-family: 'Newsreader', serif;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      .top-bar__mode {
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-muted);
        border: 1px solid var(--border-strong);
        padding: 0.15rem 0.45rem;
        border-radius: var(--radius-sm);
        background: var(--surface);
      }
      .top-bar__hint {
        margin: 0;
        font-size: 0.78rem;
        color: var(--text-muted);
        max-width: min(42rem, 100%);
        text-align: right;
        line-height: 1.45;
      }
      .top-bar__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
      }
      .top-bar__annotate {
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        color: var(--accent-hover);
        font: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.4rem 0.85rem;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background var(--duration) var(--ease),
          color var(--duration) var(--ease);
      }
      .top-bar__annotate:hover {
        background: var(--accent);
        color: var(--on-accent);
      }
      .top-bar__campus-select {
        display: inline-flex;
        align-items: center;
      }
      .top-bar__select {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 0.2rem 0.5rem;
        background: var(--surface);
        cursor: pointer;
        max-width: 9rem;
      }
      .map-stage {
        flex: 1;
        min-height: 52vh;
        position: relative;
        background: var(--bg);
        padding: 0.5rem 0.75rem 0.75rem;
      }
      .map-frame {
        position: relative;
        width: 100%;
        max-width: min(1400px, 100%);
        margin: 0 auto;
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        background: var(--surface-raised);
      }
      .map-frame__inner {
        position: relative;
        display: block;
        width: 100%;
        line-height: 0;
      }
      .map-frame__inner img {
        width: 100%;
        height: auto;
        vertical-align: top;
        user-select: none;
        -webkit-user-drag: none;
      }
      .map-overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .map-overlay .image-map-annotation-region {
        pointer-events: auto;
      }
      .map-overlay .map-bubble {
        pointer-events: auto;
      }
      .image-map-annotation-region {
        position: absolute;
        z-index: 1;
        margin: 0;
        padding: 0;
        border: 2px solid transparent;
        background: transparent;
        cursor: pointer;
        font: inherit;
        appearance: none;
        border-radius: var(--radius-sm);
        transform: scale(1);
        transform-origin: center center;
        transition:
          transform var(--duration) var(--ease),
          border-color var(--duration) var(--ease),
          background var(--duration) var(--ease),
          filter var(--duration) var(--ease);
      }
      .image-map-annotation-region--rect-blue {
        border-color: rgba(52, 98, 168, 0.78);
        background: rgba(52, 98, 168, 0.1);
      }
      .image-map-annotation-region--rect-blue:hover {
        transform: scale(1.12);
        z-index: 22;
        filter: drop-shadow(0 10px 20px rgba(61, 56, 52, 0.18));
      }
      .image-map-annotation-region--rect-red {
        border-color: rgba(196, 72, 62, 0.82);
        background: rgba(196, 72, 62, 0.1);
      }
      .image-map-annotation-region--rect-red:hover {
        transform: scale(1.12);
        z-index: 22;
        filter: drop-shadow(0 10px 20px rgba(61, 56, 52, 0.18));
      }
      .image-map-annotation-region__label {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 5px);
        transform: translateX(-50%);
        max-width: min(220px, 44vw);
        padding: 0.22rem 0.5rem;
        border-radius: var(--radius-sm);
        background: var(--surface-raised);
        border: 1px solid var(--border);
        font-size: clamp(10px, 2.2vw, 13px);
        font-weight: 600;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
        opacity: 0;
        transition: opacity var(--duration) var(--ease);
        box-shadow: var(--shadow-sm);
      }
      .image-map-annotation-region:hover .image-map-annotation-region__label {
        opacity: 1;
      }
      .map-bubble {
        position: absolute;
        z-index: 2;
        transform: translate(-50%, -100%);
        transform-origin: 50% 100%;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        text-align: center;
        max-width: min(120px, 22vw);
      }
      .map-bubble--alumni-post {
        filter: drop-shadow(0 4px 12px rgba(61, 56, 52, 0.2));
      }
      .image-map-marker__dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        margin: 0 auto 4px;
        box-shadow: 0 0 0 2px var(--surface-raised);
      }
      .map-bubble--alumni-post .image-map-marker__dot {
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.95),
          0 4px 14px rgba(61, 56, 52, 0.25);
      }
      .image-map-marker__thumb {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        border: 2px solid var(--surface-raised);
        display: block;
        margin: 0 auto;
      }
      .image-map-marker__label {
        font-size: clamp(9px, 2vw, 12px);
        line-height: 1.25;
        margin-top: 4px;
        color: var(--text);
        font-weight: 600;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .map-bubble__badge {
        position: absolute;
        top: -4px;
        right: -2px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 0.65rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .timeline {
        flex: 0 0 auto;
        z-index: 6;
        padding: 0.5rem 0 1rem;
        background: var(--surface-raised);
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 24px rgba(61, 56, 52, 0.04);
      }
      .timeline__inner {
        max-width: min(1200px, 100%);
        margin: 0 auto;
        padding: 0 0.75rem;
      }
      .timeline__label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.4rem;
      }
      .timeline__title {
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 500;
      }
      .timeline__year {
        font-family: 'Newsreader', serif;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--accent);
      }
      .timeline-range {
        width: 100%;
        accent-color: var(--accent);
        margin: 0.25rem 0 0;
      }
      .ai-tab {
        position: fixed;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        z-index: 20;
        writing-mode: vertical-rl;
        padding: 1rem 0.4rem;
        border: none;
        border-radius: 10px 0 0 10px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        cursor: pointer;
        box-shadow: -4px 4px 24px var(--accent-glow);
      }
      .ai-tab--open {
        right: min(360px, 100vw);
      }
      @media (max-width: 640px) {
        .ai-tab--open {
          right: 100%;
          opacity: 0;
          pointer-events: none;
        }
      }
      .ai-panel {
        position: fixed;
        top: 0;
        right: 0;
        width: min(360px, 100vw);
        height: 100%;
        z-index: 19;
        background: var(--surface-raised);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.3s var(--ease);
        box-shadow: -8px 0 40px rgba(61, 56, 52, 0.08);
      }
      .ai-panel--open {
        transform: translateX(0);
      }
      .ai-panel__head {
        position: relative;
        padding: 1.1rem 1rem 0.85rem;
        border-bottom: 1px solid var(--border);
      }
      .ai-panel__close {
        position: absolute;
        top: 0.55rem;
        right: 0.5rem;
        border: none;
        background: none;
        color: var(--text-muted);
        font-size: 1.35rem;
        line-height: 1;
        cursor: pointer;
        padding: 0.25rem;
        border-radius: var(--radius-sm);
      }
      .ai-panel__head h2 {
        margin: 0;
        font-family: 'Newsreader', serif;
        font-size: 1.2rem;
        font-weight: 600;
      }
      .ai-panel__sub {
        margin: 0.35rem 0 0;
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      .ai-panel__thread {
        flex: 1;
        overflow: auto;
        padding: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        background: var(--surface);
      }
      .ai-bubble {
        max-width: 95%;
        padding: 0.6rem 0.7rem;
        border-radius: var(--radius-md);
        font-size: 0.82rem;
        line-height: 1.55;
      }
      .ai-bubble--user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: var(--shadow-sm);
      }
      .ai-bubble--assistant {
        align-self: flex-start;
        background: var(--surface-raised);
        border: 1px solid var(--border);
      }
      .ai-panel__composer {
        padding: 0.75rem;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background: var(--surface-raised);
      }
      .ai-panel__composer textarea {
        width: 100%;
        resize: none;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text);
        padding: 0.55rem 0.6rem;
        font: inherit;
        font-size: 0.85rem;
      }
      .ai-panel__send {
        align-self: flex-end;
        border: none;
        border-radius: 999px;
        padding: 0.45rem 1.2rem;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        font-size: 0.82rem;
        cursor: pointer;
      }
      .rag-section {
        margin-top: 0.65rem;
      }
      .rag-section__title {
        margin: 0 0 0.4rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }
      .rag-section__cards {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .rag-card {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 0.5rem;
        padding: 0.45rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
      }
      button.rag-card {
        width: 100%;
        margin: 0;
        cursor: pointer;
        text-align: left;
        font: inherit;
        color: inherit;
        appearance: none;
      }
      .rag-card__img {
        display: block;
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: var(--radius-sm);
      }
      .rag-card__title {
        font-size: 0.72rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .rag-card__score {
        font-weight: 400;
        color: var(--text-muted);
      }
      .rag-card__slice {
        margin: 0;
        font-size: 0.72rem;
        line-height: 1.45;
        color: var(--text-muted);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 160px;
        overflow: auto;
      }
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(61, 56, 52, 0.35);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .detail-sheet {
        width: min(520px, 100%);
        max-height: min(82vh, 720px);
        overflow: auto;
        background: var(--surface-raised);
        border-radius: var(--radius-lg);
        padding: 1.25rem 1.25rem 1.5rem;
        position: relative;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
      }
      .detail-sheet__close {
        position: absolute;
        top: 0.65rem;
        right: 0.75rem;
        border: none;
        background: var(--surface);
        color: var(--text-muted);
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
      }
      .detail-sheet__kind {
        margin: 0 0 0.25rem;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }
      .detail-sheet h2 {
        margin: 0 0 0.35rem;
        font-family: 'Newsreader', serif;
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.25;
      }
      .detail-sheet__meta {
        margin: 0 0 0.85rem;
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .detail-sheet__hero {
        width: 100%;
        border-radius: var(--radius-md);
        margin-bottom: 0.85rem;
        max-height: 220px;
        object-fit: cover;
        border: 1px solid var(--border);
      }
      .detail-sheet__body {
        font-size: 0.92rem;
        line-height: 1.65;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }
      .detail-sheet__body p {
        margin: 0;
      }
      .detail-sheet__post-list {
        list-style: none;
        margin: 0.5rem 0 0;
        padding: 0;
      }
      .detail-sheet__post-row {
        width: 100%;
        text-align: left;
        padding: 0.65rem 0;
        border: none;
        border-bottom: 1px solid var(--border);
        background: none;
        font: inherit;
        cursor: pointer;
      }
      .detail-sheet__post-body {
        padding: 0.5rem 0 0.75rem 0.5rem;
        font-size: 0.88rem;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      同目录放置 campus-basemap.jpg（校园平面图）。若无此文件，将自动使用 campus-placeholder.svg。
      双击本文件即可在浏览器打开（file://）；部分浏览器对外链图片有限制，属正常现象。
    -->
    <div class="app-shell">
      <header class="top-bar">
        <div class="top-bar__brand">
          <span class="top-bar__name">深大记忆</span>
          <label class="top-bar__campus-select">
            <span class="visually-hidden">校区</span>
            <select id="campusSelect" class="top-bar__select" aria-label="选择校区">
              <option value="yuehai" selected>粤海校区</option>
              <option value="lihu">丽湖校区</option>
            </select>
          </label>
          <span class="top-bar__mode">平面图模式</span>
          <span class="top-bar__mode">静态演示</span>
        </div>
        <div class="top-bar__row">
          <p class="top-bar__hint" id="topHint"></p>
          <div class="top-bar__actions">
            <button type="button" class="top-bar__annotate" id="btnAnnotate">标注数据</button>
          </div>
        </div>
      </header>

      <main class="map-stage">
        <div class="map-frame">
          <div class="map-frame__inner" id="mapInner">
            <img
              id="basemapImg"
              src="campus-basemap.jpg"
              alt="校园平面图"
              onerror="this.onerror=null;this.src='campus-placeholder.svg'"
            />
            <div class="map-overlay" id="mapOverlay"></div>
          </div>
        </div>
      </main>

      <div class="timeline">
        <div class="timeline__inner">
          <div class="timeline__label">
            <span class="timeline__title">时间轴</span>
            <span class="timeline__year" id="timelineLabel">现在</span>
          </div>
          <input type="range" id="timelineRange" class="timeline-range" min="0" max="528" value="528" />
        </div>
      </div>
    </div>

    <button type="button" class="ai-tab" id="aiTab" aria-expanded="true">记忆助手</button>
    <aside class="ai-panel ai-panel--open" id="aiPanel" aria-label="记忆助手">
      <div class="ai-panel__head">
        <button type="button" class="ai-panel__close" id="aiClose" aria-label="关闭">×</button>
        <h2>记忆助手</h2>
        <p class="ai-panel__sub">静态演示：模拟流式回复与检索卡片（与 frontend-demo 一致）</p>
      </div>
      <div class="ai-panel__thread" id="aiThread"></div>
      <div class="ai-panel__composer">
        <textarea id="aiInput" rows="2" placeholder="问校史、地点、帖子…"></textarea>
        <button type="button" class="ai-panel__send" id="aiSend">发送</button>
      </div>
    </aside>

    <div class="sheet-backdrop" id="detailBackdrop" hidden>
      <article class="detail-sheet" role="dialog" aria-modal="true">
        <button type="button" class="detail-sheet__close" id="detailClose" aria-label="关闭">×</button>
        <div id="detailContent"></div>
      </article>
    </div>

    <script>
      ;(function () {
        const TIMELINE_LATEST_INDEX = 528
        const ABOVE = 0.028
        const PLACEHOLDER_IMG =
          'data:image/svg+xml,' +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect fill="#e8e4df" width="120" height="120"/><text x="60" y="68" text-anchor="middle" fill="#8a8278" font-size="11" font-family="system-ui">无图</text></svg>',
          )

        const ANNOTATIONS = [
          {
            id: '15274731-aa0b-4c48-ab6a-302559ba5652',
            label: '汇星楼（科技楼）',
            frameStyle: 'rect-blue',
            bbox: { nx: 0.361139065354052, ny: 0.30064404894811525, nw: 0.08134323181900922, nh: 0.01183569093274621 },
          },
          {
            id: 'f6f99074-5164-4eb9-9f64-841c3573705a',
            label: '元平体育馆',
            frameStyle: 'rect-blue',
            bbox: { nx: 0.4716101215605488, ny: 0.25442853304427443, nw: 0.05682028965743342, nh: 0.009266538362547521 },

        const annById = Object.fromEntries(ANNOTATIONS.map((a) => [a.id, a]))

        function anchorFromAnn(a) {
          const b = a.bbox
          return {
            nx: Math.min(1, Math.max(0, b.nx + b.nw / 2)),
            ny: Math.min(1, Math.max(0, b.ny - ABOVE)),
          }
        }

        function hydratePost(p) {
          const a = annById[p.placeId]
          if (!a) return { ...p }
          const pt = anchorFromAnn(a)
          return { ...p, nx: pt.nx, ny: pt.ny }
        }

        function hydrateEvent(e) {
          const a = annById[e.placeId]
          if (!a) return { ...e }
          const pt = anchorFromAnn(a)
          return { ...e, nx: pt.nx, ny: pt.ny }
        }

        function groupKey(nx, ny) {
          return nx.toFixed(4) + ',' + ny.toFixed(4)
        }

        function groupPosts(posts) {
          const m = new Map()
          for (const p of posts) {
            const k = groupKey(p.nx, p.ny)
            if (!m.has(k)) m.set(k, [])
            m.get(k).push(p)
          }
          return [...m.values()].map((arr) => (arr.length === 1 ? { kind: 'post', data: arr[0] } : { kind: 'post_stack', posts: arr }))
        }

        function historicalIndexToYearMonth(index) {
          const i = Math.min(Math.max(0, index), 527)
          const y = 1983 + Math.floor(i / 12)
          const m = (i % 12) + 1
          return { year: y, month: m }
        }

        function eventsForYM(year, month) {
          return mockEvents.filter((e) => e.year < year || (e.year === year && e.month <= month))
        }

        const els = {
          overlay: document.getElementById('mapOverlay'),

        }

        function findEvent(id) {
          return mockEvents.find((e) => e.id === id)
        }
        function findPost(id) {
          return mockPosts.find((p) => p.id === id)
        }

        function renderAnnotations() {
          const frag = document.createDocumentFragment()
          for (const a of ANNOTATIONS) {
            const b = a.bbox
            const btn = document.createElement('button')
            btn.type = 'button'
            btn.className = 'image-map-annotation-region image-map-annotation-region--' + a.frameStyle
            btn.style.left = b.nx * 100 + '%'
            btn.style.top = b.ny * 100 + '%'
            btn.style.width = b.nw * 100 + '%'
            btn.style.height = b.nh * 100 + '%'
            btn.title = a.label
            const span = document.createElement('span')
            span.className = 'image-map-annotation-region__label'
            span.textContent = a.label
            btn.appendChild(span)
            frag.appendChild(btn)
          }
          return frag
        }

        function renderBubbles(items) {
          const frag = document.createDocumentFragment()
          let i = 0
          for (const item of items) {
            const nx = item.nx
            const ny = item.ny
            const b = document.createElement('button')
            b.type = 'button'
            b.className = 'map-bubble image-map-marker' + (item.kind === 'event' ? '' : ' map-bubble--alumni-post')
            b.style.left = nx * 100 + '%'
            b.style.top = ny * 100 + '%'
            b.dataset.idx = String(i++)
            const dot = document.createElement('div')
            dot.className = 'image-map-marker__dot'
            const img = document.createElement('img')
            img.className = 'image-map-marker__thumb'
            img.alt = ''
            img.loading = 'lazy'
            img.src = item.img || PLACEHOLDER_IMG
            const lab = document.createElement('div')
            lab.className = 'image-map-marker__label'
            lab.textContent = item.label
            b.appendChild(dot)
            b.appendChild(img)
            b.appendChild(lab)
            if (item.badge) {
              const badge = document.createElement('span')
              badge.className = 'map-bubble__badge'
              badge.textContent = item.badge
              b.appendChild(badge)
            }
            b.addEventListener('click', () => openDetail(item))
            frag.appendChild(b)
          }
          return frag
        }

        function buildBubbleList(timelineIndex) {
          const isLatest = timelineIndex >= TIMELINE_LATEST_INDEX
          const hydratedPosts = mockPosts.map(hydratePost)
          if (isLatest) {
            return groupPosts(hydratedPosts).map((x) => {
              if (x.kind === 'post') {
                const p = x.data
                return {
                  kind: 'post',
                  nx: p.nx,
                  ny: p.ny,
                  label: p.excerpt,
                  img: p.imageUrl,
                  raw: x,
                }
              }
              const posts = x.posts
              const p0 = posts[0]
              return {
                kind: 'post_stack',
                nx: p0.nx,
                ny: p0.ny,
                label: p0.excerpt,
                img: p0.imageUrl,
                badge: posts.length > 9 ? '9+' : String(posts.length),
                raw: x,
              }
            })
          }
          const { year, month } = historicalIndexToYearMonth(timelineIndex)
          const evs = eventsForYM(year, month).map(hydrateEvent)
          const stacks = groupPosts(hydratedPosts)
          const out = []
          for (const e of evs) {
            out.push({
              kind: 'event',
              nx: e.nx,
              ny: e.ny,
              label: e.title,
              img: e.imageUrl,
              raw: { kind: 'event', data: e },
            })
          }
          for (const s of stacks) {
            if (s.kind === 'post') {
              const p = s.data
              out.push({
                kind: 'post',
                nx: p.nx,
                ny: p.ny,
                label: p.excerpt,
                img: p.imageUrl,
                raw: s,
              })
            } else {
              const p0 = s.posts[0]
              out.push({
                kind: 'post_stack',
                nx: p0.nx,
                ny: p0.ny,
                label: p0.excerpt,
                img: p0.imageUrl,
                badge: s.posts.length > 9 ? '9+' : String(s.posts.length),
                raw: s,
              })
            }
          }
          return out
        }

        function refreshMap() {
          const idx = +els.timelineRange.value
          const isLatest = idx >= TIMELINE_LATEST_INDEX
          els.timelineLabel.textContent = isLatest ? '现在' : historicalIndexToYearMonth(idx).year + '年' + String(historicalIndexToYearMonth(idx).month).padStart(2, '0') + '月'
          els.topHint.textContent = isLatest
            ? '演示：帖子与校史均按标注地点落位；同地点帖子堆叠。'
            : '演示：历史事件与模拟帖子均按标注地点落位，可与校史气泡同时查看。'

          els.overlay.innerHTML = ''
          els.overlay.appendChild(renderAnnotations())
          const bubbles = buildBubbleList(idx)
          els.overlay.appendChild(renderBubbles(bubbles))
        }

          } else if (r.kind === 'post') {
            const p = r.data
            html =
              '<p class="detail-sheet__kind">校友帖子</p><h2>' +
              escapeHtml(p.author) +
              ' · 帖子</h2><p class="detail-sheet__meta">' +
              escapeHtml(p.address) +
              '</p>' +
              (p.imageUrl ? '<img class="detail-sheet__hero" src="' + escapeAttr(p.imageUrl) + '" alt=""/>' : '') +
              '<div class="detail-sheet__body"><p>' +
              escapeHtml(p.body) +
              '</p></div>'
          } else {
            const posts = r.posts
            html =
              '<p class="detail-sheet__kind">校友帖子 · 同一地点</p><h2>该地点共 ' +
              posts.length +
              ' 条</h2><p class="detail-sheet__meta">点击下方条目展开</p><ul class="detail-sheet__post-list" id="stackList"></ul>'
          }
          els.detailContent.innerHTML = html
          if (r.kind === 'post_stack') {
            const ul = document.getElementById('stackList')
            for (const p of r.posts) {
              const li = document.createElement('li')
              const btn = document.createElement('button')
              btn.type = 'button'
              btn.className = 'detail-sheet__post-row'
              btn.innerHTML =
                '<strong>' +
                escapeHtml(p.author) +
                '</strong> · <span style="color:var(--text-muted)">' +
                escapeHtml(p.excerpt) +
                '</span>'
              const body = document.createElement('div')
              body.className = 'detail-sheet__post-body'
              body.hidden = true
              body.innerHTML =
                (p.imageUrl ? '<img class="detail-sheet__hero" src="' + escapeAttr(p.imageUrl) + '" alt=""/>' : '') +
                '<p>' +
                escapeHtml(p.body) +
                '</p><p style="color:var(--text-muted);font-size:0.85rem">地点：' +
                escapeHtml(p.address) +
                '</p>'
              btn.addEventListener('click', () => {
                body.hidden = !body.hidden
              })
              li.appendChild(btn)
              li.appendChild(body)
              ul.appendChild(li)
            }
          }
          els.detailBackdrop.hidden = false
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
        }
        function escapeAttr(s) {
          return escapeHtml(s).replace(/"/g, '&quot;')
        }

        function closeDetail() {
          els.detailBackdrop.hidden = true
        }

        function toggleAi(open) {
          const o = open !== undefined ? open : !els.aiPanel.classList.contains('ai-panel--open')
          els.aiPanel.classList.toggle('ai-panel--open', o)
          els.aiTab.classList.toggle('ai-tab--open', o)
          els.aiTab.setAttribute('aria-expanded', o ? 'true' : 'false')
        }

          wrap.className = 'ai-bubble ai-bubble--assistant'

          textEl.className = 'ai-assistant-text'
          wrap.appendChild(textEl)

        function renderRagSection(title, items, type) {

          sec.className = 'rag-section'
          sec.innerHTML = '<h4 class="rag-section__title">' + escapeHtml(title) + '</h4><div class="rag-section__cards"></div>'

              escapeHtml(c.snippet) +
              '</pre></div>'
            btn.addEventListener('click', () => {
              if (type === 'event') {
                const e0 = findEvent(c.source_id)
                if (e0) {
                  const e = hydrateEvent(e0)
                  openDetail({
                    raw: { kind: 'event', data: e },
                    nx: e.nx,
                    ny: e.ny,
                    label: e.title,
                    img: e.imageUrl,
                  })
                }
              } else {
                const p = findPost(c.source_id)
                if (p) {
                  const h = hydratePost(p)
                  openDetail({ raw: { kind: 'post', data: h }, nx: h.nx, ny: h.ny, label: h.excerpt, img: h.imageUrl })
                }
              }
            })
            cards.appendChild(btn)
          }
          return sec
        }

        async function runMockStream(message) {
          appendUserBubble(message)
          const intro = appendAssistantShell()
          intro.textEl.textContent =
            '下面自动播放一段模拟对话：你会看到「用户提问 → 检索参考卡片 → 流式文字」。点击下方参考卡片可打开地图同款详情。'
          await sleep(200)
          const shell = appendAssistantShell()
          const ragWrap = document.createElement('div')
          shell.wrap.appendChild(ragWrap)
          ragWrap.appendChild(renderRagSection('校史参考', DEMO_RAG_EVENTS, 'event'))
          ragWrap.appendChild(renderRagSection('帖子参考', DEMO_RAG_POSTS, 'post'))
          const textEl = document.createElement('div')
          textEl.style.marginTop = '0.5rem'
          shell.wrap.appendChild(textEl)
          await sleep(220)
          const isLatest = +els.timelineRange.value >= TIMELINE_LATEST_INDEX
          const ym = historicalIndexToYearMonth(+els.timelineRange.value)
          const modeHint = isLatest
            ? '当前为「最新」上下文（演示）。'
            : '当前历史上下文：' + ym.year + '年' + ym.month + '月（演示）。'
          const answer =
            modeHint +
            ' 以下为模拟流式输出：检索结果请以卡片中的原文切片为准。你的问题「' +
            message.slice(0, 40) +
            (message.length > 40 ? '…' : '') +
            '」已记录。'
          await sleep(120)
          for (let i = 0; i < answer.length; i += 2) {
            textEl.textContent += answer.slice(i, i + 2)
            els.aiThread.scrollTop = els.aiThread.scrollHeight
            await sleep(28)
          }
        }

        function sleep(ms) {
          return new Promise((r) => setTimeout(r, ms))
        }

        document.getElementById('btnAnnotate').addEventListener('click', () => {
          alert('静态 HTML 不包含标注工作台。\n请在本机运行：cd frontend-demo && npm install && npm run dev')
        })

        els.timelineRange.addEventListener('input', refreshMap)
        els.timelineRange.addEventListener('change', refreshMap)
        els.detailClose.addEventListener('click', closeDetail)
        els.detailBackdrop.addEventListener('click', (e) => {
          if (e.target === els.detailBackdrop) closeDetail()
        })

        els.aiTab.addEventListener('click', () => toggleAi())
        els.aiClose.addEventListener('click', () => toggleAi(false))
        els.aiSend.addEventListener('click', () => {
          const t = els.aiInput.value.trim()
          if (!t) return
          els.aiInput.value = ''
          void runMockStream(t)
        })

        els.aiThread.appendChild(
          (function () {
            const d = document.createElement('div')
            d.className = 'ai-bubble ai-bubble--assistant'
            d.textContent =
              '你好。这是单文件静态演示：时间轴、平面图气泡、详情弹层与记忆助手模拟流式（无真实后端）。将 campus-basemap.jpg 放在本文件同目录即可替换底图。'
            return d
          })(),
        )

        refreshMap()
      })()
    </script>
  </body>
</html>
